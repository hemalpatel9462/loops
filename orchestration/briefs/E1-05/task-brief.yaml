schemaVersion: "1.0"
artifactType: task-brief
taskId: "E1-05"
title: "Browser regression and responsive coverage"
phase: 4
goal: "Update end-to-end coverage to assert the new product flow and remove stale Quick Play assumptions."
context:
  - "PROJECT_STRUCTURE_AND_DEPLOYMENT.md"
  - "orchestration/REQUIREMENTS.md"
  - "orchestration/ENHANCEMENTS_IMPLEMENTATION_PLAN.md"
  - "orchestration/ORCHESTRATOR_INSTRUCTIONS.md"
  - "tests/e2e/helpers.ts"
  - "tests/e2e/gameplay.spec.ts"
  - "tests/e2e/accessibility.spec.ts"
  - "tests/e2e/responsive.spec.ts"
  - "playwright.config.ts"
dependencies: ["E1-03", "E1-04"]
writeScope:
  - "tests/e2e/helpers.ts"
  - "tests/e2e/gameplay.spec.ts"
  - "tests/e2e/accessibility.spec.ts"
  - "tests/e2e/responsive.spec.ts"
  - "tests/e2e/enhancements.spec.ts"
forbiddenScope:
  - "apps/**"
  - "packages/**"
  - "schemas/**"
  - "orchestration/task-registry.json"
  - "orchestration/briefs/**"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-brief.yaml"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-report.yaml"
acceptanceCriteria:
  - id: "AC-1"
    description: "Browser coverage verifies the fresh Start screen, transition to selection, difficulty counts, and one-based puzzle numbers."
  - id: "AC-2"
    description: "Browser coverage verifies that puzzle 1 starts, the next puzzle is locked before completion, and completion unlocks the next puzzle with a success and text status."
  - id: "AC-3"
    description: "Browser coverage verifies unfinished selected-puzzle reload/resume, Continue, saved mode, Daily Loop, and absence of Quick Play."
  - id: "AC-4"
    description: "Browser coverage verifies Settings mode persistence and that How to play opens and closes the tutorial with keyboard-reachable controls."
  - id: "AC-5"
    description: "Browser coverage verifies Dark Mode and High Contrast are absent while reduced-motion behavior remains passing."
  - id: "AC-6"
    description: "Phone, tablet, and desktop coverage verifies the revised start and selection screens have no horizontal overflow."
requiredChecks:
  - "npm run typecheck"
  - "npm run test:e2e"
implementationReportPath: "runs/<run-id>/tasks/E1-05/implementation-report.yaml"
instructions:
  - "Read this brief and all listed context before editing."
  - "Replace stale Quick Play helpers and fixture assumptions with the selected-puzzle flow."
  - "Reset local storage deterministically for each scenario so progression tests do not depend on test order."
  - "Prefer accessible role and state assertions over CSS-only selectors."
  - "Modify only the assigned E2E scope and preserve unrelated user changes."
  - "Run the required checks or record why a check is unavailable."
  - "Write the implementation report before returning and list every changed file."
