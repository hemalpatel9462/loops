schemaVersion: "1.0"
artifactType: verification-brief
taskId: "P0-01"
implementationReportPath: "runs/<run-id>/tasks/P0-01/implementation-report.yaml"
scopeReviewed:
  - "package.json"
  - "package-lock.json"
  - "tsconfig*.json"
  - "apps/web-game/**"
  - "vite.config.ts"
  - ".gitignore"
  - "vercel.json"
acceptanceCriteria:
  - id: "AC-1"
    description: "React + TypeScript + Vite app exists under apps/web-game."
  - id: "AC-2"
    description: "npm workspaces cover apps/*, packages/*, and tools/*."
  - id: "AC-3"
    description: "Shared workspace packages can be imported by the web app."
  - id: "AC-4"
    description: "TypeScript, lint, unit-test, and build commands are defined."
  - id: "AC-5"
    description: "Production build emits apps/web-game/dist without generator-only code."
requiredChecks:
  - command: "npm install or npm ci"
    purpose: "Verify the task acceptance criteria and detect regressions."
  - command: "npm run typecheck"
    purpose: "Verify the task acceptance criteria and detect regressions."
  - command: "npm run build"
    purpose: "Verify the task acceptance criteria and detect regressions."
constraints:
  - "Do not modify production code."
  - "Treat the implementation report as a claim and verify it against the files."
  - "Check every acceptance criterion independently."
  - "Record evidence with file paths, test names, or command output."
verificationReportPath: "runs/<run-id>/tasks/P0-01/verification-report.yaml"

