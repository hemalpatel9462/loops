schemaVersion: "1.0"
artifactType: task-brief
taskId: "E1-02"
title: "Puzzle progression domain and selection APIs"
phase: 4
goal: "Replace Quick Play selection with deterministic, persisted, sequential puzzle selection while preserving Daily Loop and Continue."
context:
  - "loops_game_design_spec.md"
  - "PROJECT_STRUCTURE_AND_DEPLOYMENT.md"
  - "orchestration/REQUIREMENTS.md"
  - "orchestration/ENHANCEMENTS_IMPLEMENTATION_PLAN.md"
  - "orchestration/ORCHESTRATOR_INSTRUCTIONS.md"
  - "apps/web-game/src/state/game-flow/game-flow.ts"
  - "apps/web-game/src/state/game-flow/puzzle-catalog.ts"
  - "apps/web-game/src/persistence/types.ts"
dependencies: ["P2-03", "P2-05", "P2-06"]
writeScope:
  - "apps/web-game/src/state/game-flow/types.ts"
  - "apps/web-game/src/state/game-flow/puzzle-catalog.ts"
  - "apps/web-game/src/state/game-flow/game-flow.ts"
  - "apps/web-game/src/state/game-flow/index.ts"
  - "apps/web-game/src/state/game-flow/game-flow.test.ts"
forbiddenScope:
  - "apps/web-game/src/persistence/**"
  - "apps/web-game/src/screens/**"
  - "apps/web-game/src/app/**"
  - "apps/web-game/src/components/**"
  - "tests/e2e/**"
  - "packages/puzzle-data/**"
  - "orchestration/task-registry.json"
  - "orchestration/briefs/**"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-brief.yaml"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-report.yaml"
acceptanceCriteria:
  - id: "AC-1"
    description: "Each difficulty exposes a deterministic one-based puzzle sequence numbered 1 through N using validated catalog order."
  - id: "AC-2"
    description: "Puzzle status exposes available, in-progress, completed, and locked states using persisted per-puzzle progress."
  - id: "AC-3"
    description: "Puzzle 1 is available initially and each later puzzle is blocked until its immediate predecessor has a completed persisted record."
  - id: "AC-4"
    description: "The selected-puzzle API starts valid available puzzles, resumes unfinished progress, allows completed-puzzle replay, and rejects invalid or locked selections without creating progress."
  - id: "AC-5"
    description: "Daily Loop remains deterministic and Continue preserves saved edge state, elapsed time, hints, checks, and mode."
  - id: "AC-6"
    description: "Quick Play is no longer required by the game-flow public path while Daily Loop and Continue sources remain supported."
requiredChecks:
  - "npm run typecheck"
  - "npm run test"
  - "npm run build"
implementationReportPath: "runs/<run-id>/tasks/E1-02/implementation-report.yaml"
instructions:
  - "Read this brief and all listed context before editing."
  - "Use existing PlayerProgress completion records as the source of truth; do not add a duplicate completion ledger without documenting why."
  - "Keep catalog ordering deterministic and make invalid puzzle numbers fail safely."
  - "Preserve Daily Loop and Continue semantics while removing Quick Play callers from the active path."
  - "Modify only the assigned write scope and preserve unrelated user changes."
  - "Run the required checks or record why a check is unavailable."
  - "Write the implementation report before returning and list every changed file."
