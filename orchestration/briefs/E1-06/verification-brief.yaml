schemaVersion: "1.0"
artifactType: verification-brief
taskId: "E1-06"
implementationReportPath: "runs/<run-id>/tasks/E1-06/implementation-report.yaml"
scopeReviewed:
  - "E1-01 through E1-05 implementation and verification reports"
  - "apps/web-game/**"
  - "packages/puzzle-format/**"
  - "schemas/**"
  - "tests/e2e/**"
  - "orchestration/ENHANCEMENTS_IMPLEMENTATION_PLAN.md"
acceptanceCriteria:
  - id: "AC-1"
    description: "E1-01 through E1-05 each have implementation and verification reports with PASS results and no unresolved remediation."
  - id: "AC-2"
    description: "The production typecheck, unit tests, schema validation, catalog validation, production build, and browser tests all pass."
  - id: "AC-3"
    description: "The Start-to-selection-to-puzzle flow, sequential unlocking, persisted completion, global mode setting, tutorial, Daily Loop, Continue, and reduced-motion behavior are integrated without regression."
  - id: "AC-4"
    description: "No user-facing Quick Play, Dark Mode, or High Contrast path remains, and no release-blocking stale references remain."
  - id: "AC-5"
    description: "The final report records any differences between planning assumptions and implemented product behavior."
requiredChecks:
  - command: "npm run typecheck"
    purpose: "Verify all workspace TypeScript contracts after the complete enhancement wave."
  - command: "npm test"
    purpose: "Verify all unit and package tests."
  - command: "npm run validate:schemas"
    purpose: "Verify shared schema and contract validation."
  - command: "npm run validate:catalog"
    purpose: "Verify the validated puzzle catalog remains intact."
  - command: "npm run build"
    purpose: "Verify the production build is release-ready."
  - command: "npm run test:e2e"
    purpose: "Verify the integrated browser flow, responsive behavior, and accessibility scenarios."
constraints:
  - "Do not modify production code, tests, task registry, briefs, or verification artifacts."
  - "Treat all prior reports as evidence to audit, not as proof without checking the current worktree."
  - "Check every acceptance criterion independently and record command output and report paths."
  - "If any gate fails, return FAIL with an exact remediation task instead of marking the wave complete."
verificationReportPath: "runs/<run-id>/tasks/E1-06/verification-report.yaml"
