    change: "Added analyzer workspace package and test, typecheck, and analyze:puzzles scripts."
  - path: "tools/puzzle-analyzer/tsconfig.json"
    change: "Configured strict analyzer typechecking and Node-compatible TypeScript imports."
  - path: "tools/puzzle-analyzer/vitest.config.ts"
    change: "Scoped Vitest discovery to analyzer tests."
