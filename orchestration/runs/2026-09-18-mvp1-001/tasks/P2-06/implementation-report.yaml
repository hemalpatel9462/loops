    change: "Recorded implementation scope, acceptance evidence, command results, deviations, and risks."
acceptanceCriteria:
  - id: AC-1
    result: PASS
    evidence:
      - "puzzle-catalog.ts parses the checked-in catalog puzzle JSON through parsePuzzleDefinition before exposing it to the flow."
      - "selectQuickPlayPuzzle filters by requested difficulty and chooses from validated local puzzles using a stable seed."
      - "game-flow.test.ts verifies Quick Play returns the requested beginner puzzle and persists an unfinished move."
  - id: AC-2
    result: PASS
    evidence:
      - "selectDailyPuzzle hashes daily:<YYYY-MM-DD> against the sorted local catalog, so the same date always selects the same puzzle offline."
      - "startDailyLoop persists the date, stable seed, puzzle ID, and in-progress status using the approved DailyLoopState contract."
      - "game-flow.test.ts verifies repeated date selection equality and the persisted date mapping."
  - id: AC-3
    result: PASS
    evidence:
      - "getContinueProgress loads the versioned Continue pointer through the existing persistence repository and resolves its puzzle from the validated local catalog."
      - "resumeContinue restores saved edge states, mode, elapsed seconds, hints, checks, and start time through restoreGameStateFromProgress."
      - "game-flow.test.ts verifies Continue resumes the saved Assisted mode, time, and edge choice."
  - id: AC-4
    result: PASS
    evidence:
      - "ModeSelectionScreen exposes Relaxed and Assisted choices with accessible pressed state and explanatory labels."
      - "cycleSessionEdge always allows Relaxed moves, while Assisted moves are rejected when the engine hint consistency result identifies a clue, vertex, or premature-loop contradiction."
      - "game-flow.test.ts verifies an immediately contradictory move is flagged in Assisted mode but accepted in Relaxed mode."
  - id: AC-5
    result: PASS
    evidence:
      - "completeSession validates the single-loop completion through @loops/game-engine/validation before saving completion state."
      - "CompletionStats includes puzzle ID, difficulty, mode, elapsedSeconds, hintsUsed, and completedAt."
      - "recordCompletion updates approved PlayerStatistics totals, best time, average time, per-difficulty completion, and hint counts; Daily Loop completion also records completionTimeSeconds and hintsUsed."
      - "CompletionScreen renders time and hint count, and game-flow.test.ts verifies both values in persisted statistics and completion output."
commandsRun:
  - command: "npm run test --workspace @loops/web-game -- --run"
    exitCode: 0
    result: "Vitest passed 6 test files and 18 tests, including 5 game-flow tests."
  - command: "npm run typecheck"
    exitCode: 0
    result: "Root workspace typecheck passed for web-game and all existing workspaces."
  - command: "npm run build"
    exitCode: 0
    result: "Root production build passed and emitted apps/web-game/dist."
  - command: "npm run test:e2e -- --grep modes"
    exitCode: 1
    result: "The root package reported Missing script: test:e2e; the browser harness is owned by P3-02 and no root scripts were modified within this task scope."
deviations:
  - "The requested browser modes check is unavailable until P3-02 adds the Playwright/test:e2e harness; deterministic focused tests cover the flow behavior in the interim."
  - "GameFlowScreen exposes onSessionStart but is not mounted by AppShell, and it does not render the board itself; AppShell/board/engine wiring is outside the P2-06 write scope and belongs to P3-01."
  - "Local puzzle JSON is imported from packages/puzzle-data through the flow module because adding a dependency entry to apps/web-game/package.json is outside this task's write scope; the orchestrator should confirm clean-install workspace linking before release."
knownRisks:
  - "The current daily streak increment is intentionally local and conservative; a later integration or playtest pass may need consecutive-date streak rules rather than incrementing on every completed Daily Loop."
  - "The Assisted mode uses the engine's partial consistency deductions and does not prevent every globally impossible move that requires exhaustive search; completion validation remains authoritative."
  - "The flow screen actions hand sessions to the integration callback but do not navigate to a board until P3-01 mounts the board and reducer."
handoffNotes: |
  P3-01 should mount GameFlowScreen from screens, provide onSessionStart, and
  connect the returned GameFlowSession to the board/reducer. Use
  cycleSessionEdge, requestSessionHint, checkSessionProgress, and
  completeSession as the flow-facing action boundary so Relaxed/Assisted,
  persistence, and completion statistics remain consistent.
