  - path: "apps/web-game/src/screens/CompletionScreen.tsx"
    change: "Added completion feedback showing difficulty, mode, elapsed time, and hints used."
  - path: "apps/web-game/src/screens/GameFlowScreen.tsx"
    change: "Added a reusable flow coordinator and onSessionStart integration callback for the later board/app integration task."
  - path: "apps/web-game/src/screens/index.ts"
