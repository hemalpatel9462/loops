acceptanceCriteria:
  - id: AC-1
    verdict: PASS
    evidence:
      - "puzzle-catalog.ts imports all five checked-in local puzzle JSON records, parses each with parsePuzzleDefinition, sorts them deterministically, and verifies each puzzle ID is represented in catalog.json."
      - "selectQuickPlayPuzzle filters the validated source by requested difficulty and selects deterministically using stableHash; startQuickPlay creates a local session and records a started statistic."
      - "game-flow.test.ts test 'selects a validated local puzzle for Quick Play and persists unfinished progress' confirms a requested beginner puzzle and an unfinished persisted move."
  - id: AC-2
    verdict: PASS
    evidence:
      - "selectDailyPuzzle applies stableHash('daily:' + date) modulo the sorted local puzzle list, so the same date maps to the same offline puzzle."
      - "startDailyLoop persists date, seed, puzzle ID, and in-progress status through the approved DailyLoopState repository contract."
      - "game-flow.test.ts test 'selects Daily Loop deterministically by date and stores the date mapping' asserts repeated date equality and persisted mapping for 2026-09-18."
  - id: AC-3
    verdict: PASS
    evidence:
      - "getContinueProgress loads the versioned Continue pointer, resolves its puzzle only from the validated local source, and returns the matching progress/puzzle pair."
      - "resumeContinue restores saved mode, elapsed seconds, hints, checks, start time, and line/X edge state through restoreGameStateFromProgress; pointer identity is checked by the persistence repository."
      - "game-flow.test.ts test 'resumes Continue with the saved mode, elapsed time, hints, and edge choices' verifies Assisted mode, 42 seconds, and the saved edge state."
  - id: AC-4
    verdict: PASS
    evidence:
      - "ModeSelectionScreen exposes Relaxed and Assisted choices with aria-pressed state and explanatory behavior labels."
      - "cycleSessionEdge always accepts Relaxed moves, while Assisted moves call findDeductions and reject inconsistent clue, vertex, or premature-loop states with explicit feedback."
      - "game-flow.test.ts test 'flags an immediately contradictory move in Assisted mode but allows it in Relaxed mode' verifies divergent behavior for the same candidate edge."
  - id: AC-5
    verdict: PASS
    evidence:
      - "completeSession calls validateCompletion and refuses to mark a session complete until the single-loop rule result is complete."
      - "CompletionStats records puzzle ID, difficulty, mode, elapsedSeconds, hintsUsed, and completedAt; recordCompletion updates total/completed/hints totals, best and average times, and per-difficulty counts."
      - "Daily completion additionally records completedAt, hintsUsed, completionTimeSeconds, and streakCount; CompletionScreen renders elapsed time and hints used."
      - "game-flow.test.ts test 'records completion time and hint count in completion statistics' verifies 87 seconds, 2 hints, totalCompleted 1, and cleared Continue state."
