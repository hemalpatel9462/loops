acceptanceCriteria:
  - id: AC-1
    verdict: PASS
    evidence:
      - "packages/game-engine/validation/validator.ts validateClues enumerates each cell's top, bottom, left, and right edges, records actual counts, and emits deterministic expected/actual ClueViolation entries."
      - "packages/game-engine/validation/validator.test.ts test 'reports clue count mismatches' changes [0][0] to 3 and observes the expected violation {row: 0, column: 0, expected: 3, actual: 2}; the satisfied-loop test also confirms all clue counts pass."
  - id: AC-2
    verdict: PASS
    evidence:
      - "validateVertices builds a lattice adjacency graph and reports only degree 1 as endpoint and degrees other than 0 or 2 as branch; unselected vertices are absent and therefore implicitly degree 0."
      - "validator.test.ts test 'detects endpoints and branches through vertex degree violations' observes a degree-three branch and exactly two open-path endpoints."
  - id: AC-3
    verdict: PASS
    evidence:
      - "VertexValidationResult exposes violations, endpoints, and branches, with VertexViolation.kind distinguishing endpoint from branch diagnostics."
      - "The integrated validation suite passes explicit branchPuzzle and openPathPuzzle geometries through validateVertices and checks both violation categories."
  - id: AC-4
    verdict: PASS
    evidence:
      - "validateConnectivity constructs edge-connected components, reports componentCount/components, and requires non-empty selected edges, one component, and valid vertex degrees for hasSingleLoop."
      - "validator.test.ts test 'rejects multiple loops and open paths as non-single-loop connectivity' observes componentCount 2 and hasSingleLoop false for two disconnected loops, and closed/hasSingleLoop false for an open path."
  - id: AC-5
    verdict: PASS
    evidence:
      - "validateRules aggregates out-of-bounds edge rejection, clue validity, vertex validity, and connectivity.valid into valid and complete; connectivity.valid is true only for a non-empty connected closed graph."
      - "validator.test.ts test 'accepts a connected closed loop with satisfied clues' passes validLoopPuzzle with all solution edges and asserts valid, complete, clues.valid, vertices.valid, and connectivity.hasSingleLoop are true."
  
