acceptanceCriteria:
  - id: AC-1
    result: PASS
    evidence:
      - "LoopBoard.tsx renders each clue cell and cell background, every lattice dot, and every horizontal/vertical board edge through EdgeSegment."
      - "EdgeSegment renders guide edges, player line state, X state, and fixed line state; fixed lines render even when edgeStates omits the edge."
  - id: AC-2
    result: PASS
    evidence:
      - "EdgeSegment renders .loop-edge__hit-target over every edge with a transparent 2.75rem stroke-width and round caps, providing a touch-friendly target while preserving the visible geometry."
      - "The board SVG uses touch-action: manipulation and the edge target prevents browser gesture handling during pointer activation."
  - id: AC-3
    result: PASS
    evidence:
      - "EdgeSegment handles pointer-up activation and Enter/Space keyboard activation with preventDefault for keyboard scrolling."
      - "Interactive edge groups expose role=button, tabIndex, aria-label, data-edge-id, data-edge-state, and fixed-state accessibility metadata."
  - id: AC-4
    result: PASS
    evidence:
      - "LoopBoard scales its SVG to 100% width with a dimension-aware aspect ratio and bounded board widths."
      - "board.css includes phone/container sizing plus 48rem tablet and 80rem desktop breakpoints, with responsive clue typography and bounded max widths."
  - id: AC-5
    result: PASS
    evidence:
      - "LoopBoard never mutates edge state or implements edge cycling; it passes edge IDs and the semantic cycle action to onEdgeAction."
      - "EdgeSegment only dispatches onAction(edgeId, 'cycle'); game-engine state transitions remain the responsibility of the parent/state owner."
      - "Board edge enumeration is sourced from @loops/game-engine/model rather than duplicated in the UI."
