deviations:
  - "The board and edge components are intentionally not mounted into AppShell or main.tsx because those files are outside the declared P2-04 write scope; P3 integration will connect them to live puzzle state."
  - "The requested board-specific e2e command is unavailable until the browser-test task adds the root test:e2e script and Playwright configuration."
knownRisks:
  - "The board currently renders fallback clue 0 when a caller provides a short clue row; integrated callers should pass schema-valid dimensions and clues."
  - "The transparent SVG hit target uses a broad stroke in SVG user units; visual QA should confirm it remains comfortable and does not overlap neighboring edges on very small boards."
  - "Fixed edge interaction is intentionally disabled while remaining focusable and announced; the integration layer should preserve fixedEdges from the game-engine state."
handoffNotes: |
  Import LoopBoard from apps/web-game/src/components/board and pass width,
  height, clues, edgeStates, fixedEdges, and an onEdgeAction callback that
  dispatches to game-engine cycleEdge. Import EdgeSegment directly only for
  specialized board presentations. P3 browser tests can target data-edge-id,
  data-edge-state, data-fixed, role=grid, and role=button attributes. Add the
  root test:e2e route when the browser-test task owns that integration scope.
