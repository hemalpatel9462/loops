handoffNotes: |
  Public model exports are available from packages/game-engine/model and state
  exports from packages/game-engine/state. The package-level manifest should
  point its test script at model/vitest.config.ts (or an equivalent package
  config), expose model/state exports, and include a tsconfig covering both
  directories. Once that authorized setup exists, rerun the required workspace
  test and root typecheck before verification.
