  - path: "apps/web-game/src/styles/tokens.css"
    change: "Added color, spacing, typography, edge-style, radius, shadow, and transition design tokens with light, dark, and high-contrast overrides."
  - path: "apps/web-game/src/styles/global.css"
    change: "Added responsive shell layout, component styling, SVG preview styling, focus states, and reduced-motion behavior using the design tokens."
  - path: "apps/web-game/src/main.tsx"
    change: "Wired the Vite entry point to AppShell and the scoped global stylesheet."
