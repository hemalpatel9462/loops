deviations:
  - "Status is PARTIAL because AppShell.tsx and main.tsx are outside the declared P3-01 write scope, so the exported GameIntegration composition surface is not mounted by the current browser entry."
  - "The required npm run test:e2e check is unavailable until P3-02 adds the browser harness; no root scripts were changed."
knownRisks:
  - "The current running page remains the pre-existing static AppShell until an authorized integration step mounts GameIntegration from the app entry."
  - "Browser-level interaction, responsive layout, and completion flows still need P3-02 coverage once its harness exists."
  - "The reducer's Assisted-mode rejection uses the runtime hint consistency API; globally search-only contradictions remain outside the runtime hint contract."
handoffNotes: >-
  Mount GameIntegration from the authorized app host entry, e.g. replace the
  current AppShell render with the integration export, then rerun the four
  required checks. The integration public surface is available from
  apps/web-game/src/app/integration and its focused tests document the expected
  real-data and engine-delegation behavior.
