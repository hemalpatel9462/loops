  - id: AC-1
    result: PASS
    evidence:
      - "RuntimeHint exposes hintLevel 1/2/3, highlight, explanation, and reveal fields; computeHint only populates explanation at level 2+ and reveal at level 3."
      - "hints/hint-engine.test.ts verifies all three levels and the corresponding field behavior."
  - id: AC-2
    result: PASS
    evidence:
      - "DeductionType is the approved direct-clue | vertex | connectivity | contradiction union, and findDeductions classifies each generated deduction accordingly."
      - "Focused hint tests exercise direct-clue and vertex deductions, a premature-loop connectivity deduction, and the contradiction fallback category."
  - id: AC-3
    result: PASS
    evidence:
      - "Every actionable forced deduction includes HintEvidence with forced=true, a rule-specific reason, related edges, and explicit allowed/disallowed alternatives; contradiction diagnostics are explicitly forced=false."
      - "Direct-clue tests assert the line/x alternatives and forced evidence, while connectivity deductions are emitted only when the line alternative fails connectivity and the x alternative remains valid."
  - id: AC-4
    result: PASS
    evidence:
      - "computeHint/findDeductions clone normalized state data and applyHintToEdgeStates returns a new frozen edge map only when explicitly called; no hint computation writes to the input."
      - "hints/hint-engine.test.ts compares the original serialized map before/after computeHint and verifies caller-applied reveal leaves the original state unchanged."
