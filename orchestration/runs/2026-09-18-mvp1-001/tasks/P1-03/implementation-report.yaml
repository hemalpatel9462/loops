deviations:
  - "The required root npm run typecheck is currently non-zero because the shared workspace reaches pre-existing P1-02 validation/type-config errors outside this task's forbidden validation/** scope; focused hint compilation passes."
  - "The existing @loops/game-engine package test script currently wires model and validation configs but not hints; the hints suite was run explicitly through hints/vitest.config.ts. Updating package.json is outside this task's declared write scope and should be handled by the orchestrator's package integration step."
knownRisks:
  - "The hint engine uses partial clue, vertex, and premature-cycle consistency checks rather than the future exhaustive solver; the solver-backed integration task should replace or augment search-only deductions when available."
  - "The package export and test/typecheck wiring must retain the ./hints subpath and include hints/**/*.ts before downstream consumers rely on package-level imports."
  - "Contradiction hints are diagnostic and intentionally forced=false because neither candidate state is supported; callers should present them as a board inconsistency rather than an actionable move."
handoffNotes: |
  Import from packages/game-engine/hints during UI integration. computeHint
  accepts a PuzzleDefinition-shaped puzzle and either a GameState-shaped object
  or an EdgeStateMap. Use hint.highlight for level one, hint.explanation for
  explanatory level two, and hint.reveal only at level three. Apply a reveal
  explicitly with applyHintToEdgeStates; hint computation itself is pure.
