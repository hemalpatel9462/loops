    change: "Exported the runtime hint API."
  - path: "packages/game-engine/hints/vitest.config.ts"
    change: "Added a hints-scoped Vitest configuration for focused hint-suite execution."
  - path: "packages/game-engine/hints/hint-engine.test.ts"
