acceptanceCriteria:
  - id: AC-1
    verdict: PASS
    evidence:
      - "tools/puzzle-generator/pipeline/pipeline.ts buildPuzzleAttempt calls generateCandidateLoop before deriveClues, selectStartingEdges, makePuzzle, or solver validation; the hidden candidate is geometry-validated before conversion."
      - "tools/puzzle-generator/src/generator.ts produces a candidate-loop artifact with closed, connected, degree-two edges, and focused pipeline tests passed deterministically."
  - id: AC-2
    verdict: PASS
    evidence:
      - "tools/puzzle-generator/pipeline/clues.ts derives every cell clue by counting the four boundary edges present in a Set of hiddenLoopEdges."
      - "pipeline/pipeline.test.ts test 'derives one clue count per cell from hidden loop edges' derives [[2,2],[2,2]] from a 2x2 perimeter loop."
  - id: AC-3
    verdict: PASS
    evidence:
      - "tools/puzzle-generator/pipeline/starting-edges.ts computes difficultyTargetRatio, ranks solution edges using adjacent clue values and neighboring solution edges, and records a non-empty deductionValue explanation for each score."
      - "pipeline/pipeline.test.ts test 'selects a deterministic ratio of high-deduction starting edges' confirms repeatable selection, four selected edges for the 2x2 beginner ratio, and non-empty deduction explanations."
      - "The required beginner generation emitted 7 starting edges from a 16-edge solution (metadata.startingEdgeRatio 0.4375), within DIFFICULTY_PROFILES.beginner's 0.4–0.5 range."
  - id: AC-4
    verdict: PASS
    evidence:
      - "generateAcceptedPuzzle re-solves every constructed candidate and accepts only solutionCount === 1 with report.valid and report.unique; emitAcceptedPuzzle repeats parse and uniqueness checks before encoding."
      - "npm run validate:puzzles exited 0 and printed solutionCount 1 and unique true for the integration route."
      - "The focused pipeline suite passed its unique-emission and accepted-result tests; the corrected tools/puzzle-validator solver uses canonical incident-edge geometry."
  - id: AC-5
    verdict: PASS
    evidence:
      - "makePuzzle calls parsePuzzleDefinition before returning a candidate, and emitAcceptedPuzzle calls parsePuzzleDefinition plus the solver gate before encodePuzzleDefinition."
      - "npm run generate -- --difficulty beginner --count 1 exited 0 and emitted a JSON array containing schemaVersion, puzzle identity, clues, solutionEdges, startingEdges, and metadata."
      - "A direct vite-node CLI invocation piped through JSON.parse exited 0 and confirmed one parseable PuzzleDefinition-shaped record with clues, solutionEdges, and metadata."
