    evidence:
      - "npm run test:e2e exited 0: Playwright ran 32 tests across phone, tablet, desktop, and reduced-motion; 29 passed and 3 reduced-motion tests were intentionally skipped outside the reduced-motion project."
      - "The passing matrix includes edge cycling, undo/redo/reset/hints/progress, completion, Continue persistence, Daily Loop, responsive board fit, keyboard activation, and reduced-motion assertions."
  - id: AC-R2
    result: PASS
    evidence:
      - "tests/e2e/helpers.ts waits on .loop-board__svg visibility and a positive bounding-box width/height, then polls [data-edge-id] count > 0; it no longer relies on visibility of zero-area SVG g elements."
      - "tests/e2e/gameplay.spec.ts asserts the current gameplay heading and .loop-board__svg after starting Daily Loop; it no longer expects an absent daily-loop source label in .flow-screen__eyebrow."
      - "tests/e2e/accessibility.spec.ts converts computed 0s, 0.01ms, or equivalent browser serialization to milliseconds and rejects negative or greater-than-0.01ms motion durations."
  - id: AC-R3
    result: PASS
    evidence:
      - "The remediation changed only tests/e2e/helpers.ts, tests/e2e/gameplay.spec.ts, and tests/e2e/accessibility.spec.ts; playwright.config.ts was not changed."
      - "No production application files, canonical briefs, orchestration registry, verification briefs, or verification reports were modified."
