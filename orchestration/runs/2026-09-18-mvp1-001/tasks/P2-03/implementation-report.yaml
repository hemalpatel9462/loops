acceptanceCriteria:
  - id: AC-1
    result: PASS
    evidence:
      - "builder.ts generates puzzles through generateAcceptedPuzzle and validates every emitted definition with parsePuzzleDefinition."
      - "packages/puzzle-data contains five emitted schema-valid puzzle JSON files, one per approved difficulty."
      - "npm run build:catalog --workspace @loops/catalog-builder exited 0 and emitted catalog.json plus five puzzle files."
  - id: AC-2
    result: PASS
    evidence:
      - "catalog.json contains five relative puzzle paths under puzzles/<difficulty>/."
      - "validateCatalogFile checks path containment, file existence, puzzle parsing, ID equality, difficulty equality, and dimension equality for every entry."
      - "npm run validate:catalog --workspace @loops/catalog-builder exited 0 with valid=true and puzzleCount=5."
  - id: AC-3
    result: PASS
    evidence:
      - "buildCatalog rejects duplicate puzzle IDs before writing output."
      - "catalog-builder.test.ts verifies duplicate IDs throw, and validateCatalogFile reports duplicate catalog IDs."
      - "The package test suite passed all three tests."
  - id: AC-4
    result: PASS
    evidence:
      - "catalog.ts enforces the approved catalog fields, entry shape, schemaVersion, catalogVersion, generatedAt, dimensions, difficulty, relative paths, and referenced puzzle compatibility."
      - "The generated catalog validates successfully through the workspace CLI."
commandsRun:
  - command: "npm run test --workspace @loops/catalog-builder"
    exitCode: 0
    result: "Vitest passed 1 test file and 3 tests."
  - command: "npm run typecheck --workspace @loops/catalog-builder"
    exitCode: 0
    result: "Catalog-builder TypeScript compilation passed."
  - command: "npm run build:catalog --workspace @loops/catalog-builder"
    exitCode: 0
    result: "Generated five validated puzzle files and catalog.json under packages/puzzle-data."
  - command: "npm run validate:catalog --workspace @loops/catalog-builder"
    exitCode: 0
    result: "Validated catalog.json with valid=true, puzzleCount=5, and catalogVersion=1.0.0."
  - command: "npm run typecheck"
    exitCode: 0
    result: "Root workspace typecheck passed, including catalog-builder and its dependent packages."
  - command: "npm run build:catalog"
    exitCode: 1
    result: "Root package reported Missing script: build:catalog. The root convenience route is outside the declared write scope."
  - command: "npm run validate:catalog"
    exitCode: 1
    result: "Root package reported Missing script: validate:catalog. The root convenience route is outside the declared write scope."
deviations:
  - "The required root-level build:catalog and validate:catalog routes are not present in package.json and could not be added within the tools/catalog-builder/** and packages/puzzle-data/** write scope. The workspace-scoped routes pass and the orchestrator should add root aliases in integration scope before the release gate."
  - "The generated catalog timestamp is recorded at build time; callers that require reproducible bytes can supply generatedAt and explicit puzzle inputs through the public builder API."
knownRisks:
  - "The root package-lock.json must remain synchronized with the new workspace manifests for clean-install and Vercel reproducibility; lockfile/root integration is outside this task's write scope."
  - "Catalog generation depends on the P2-01 pipeline and therefore assumes its solver and schema validation remain available in the integrated workspace."
handoffNotes: |
  The orchestrator can expose the workspace commands as root build:catalog and
  validate:catalog scripts, regenerate package-lock.json, and run the release
  gate. Consumers can import @loops/puzzle-data/catalog.json or use the
  catalog-builder API to build a catalog into a chosen output directory.
