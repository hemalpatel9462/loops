  - command: "ruby -ryaml -e 'base=\"orchestration/runs/2026-09-18-mvp1-001/tasks\"; files=Dir[File.join(base,\"*\",\"verification-report*.yaml\")].sort; abort \"expected 23 reports, got #{files.length}\" unless files.length == 23; files.each { |f| d=YAML.load_file(f); abort \"invalid #{f}\" unless d.is_a?(Hash) && d[\"artifactType\"] == \"verification-report\" && d[\"taskId\"] && d[\"verdict\"] }; puts \"report_count=#{files.length}; headers=valid\"'"
    exitCode: 0
  - command: "ruby -rjson -ryaml -e 'registry=JSON.parse(File.read(\"orchestration/task-registry.json\")); expected=registry[\"tasks\"].map{|t| t[\"id\"]}.reject{|id| id==\"P4-01\"}; base=\"orchestration/runs/2026-09-18-mvp1-001/tasks\"; reports=Dir[File.join(base,\"*\",\"verification-report*.yaml\")].map{|f| [f,YAML.load_file(f)]}; latest={}; reports.each{|f,d| latest[d[\"taskId\"]]=[f,d] if !latest[d[\"taskId\"]] || File.basename(f).include?(\"remediation\")}; abort \"missing task\" unless (expected-latest.keys).empty?; abort \"non-pass latest\" unless latest.values.all?{|f,d| d[\"verdict\"]==\"PASS\"}; statuses=expected.map{|id| JSON.parse(File.read(File.join(base,id,\"status.json\")))[\"status\"]}; abort \"unverified status\" unless statuses.all?{|s| s==\"verified\"}; puts \"expected_tasks=#{expected.length}; latest_pass=#{latest.length}; statuses_verified=#{statuses.length}\"'"
    exitCode: 0
deviations:
  - "P3-02 retains its original FAIL verification report for audit history; the later remediation-1 verification report is PASS and the task status is verified, so AC-1 uses the latest report per task."
  - "The Playwright run intentionally reports three skips because the reduced-motion assertion runs only in the dedicated reduced-motion project; that project passed the assertion."
knownRisks:
  - "npm ci reports two moderate dependency audit advisories; no dependency changes were made within this release-verification scope."
  - "Root and app-local Vite configurations remain duplicated; both builds were independently run and produced byte-identical artifacts."
  - "The P3-03 verification report records a medium-risk root generate:pack output-path integration issue; the checked-in five-puzzle catalog and required validation commands pass, but the convenience alias should be corrected in a future integration change."
handoffNotes: |
  MVP1 release evidence is complete under the 2026-09-18-mvp1-001 run folder.
  The release summary recommends release readiness. Independent verification can
  reproduce the gate from command-results.md, browser-smoke.md, packaging.md,
  and the exact command/exit-code list in this report.
