  - id: AC-2
    verdict: PASS
    evidence:
      - "Fresh npm ci exited 0 (116 packages installed; npm reported two moderate audit advisories only)."
      - "Fresh npm run typecheck exited 0 for web-game, game-engine, puzzle-format, catalog-builder, puzzle-analyzer, puzzle-generator, and puzzle-validator."
