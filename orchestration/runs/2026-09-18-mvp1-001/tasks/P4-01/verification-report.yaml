      - "Fresh npm run test:e2e exited 0: 32 Playwright tests ran across phone, tablet, desktop, and reduced-motion projects; 29 passed and 3 intentional reduced-motion-only skips."
      - "Fresh npm run build exited 0: Vite transformed 93 modules and emitted apps/web-game/dist/index.html plus hashed CSS/JavaScript assets."
