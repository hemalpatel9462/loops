      - "tests/e2e/accessibility.spec.ts passed Enter/Space activation for editable edges in phone, tablet, desktop, and reduced-motion projects; the dedicated reduced-motion assertion passed with the checked-in 0/0.01ms transition contract."
      - "tests/e2e/responsive.spec.ts passed board-fit and no-horizontal-overflow checks for phone, tablet, desktop, and reduced-motion viewports."
