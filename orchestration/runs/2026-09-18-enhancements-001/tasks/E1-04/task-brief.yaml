schemaVersion: "1.0"
artifactType: task-brief
taskId: "E1-04"
title: "Global gameplay settings, shell cleanup, and tutorial wiring"
phase: 4
goal: "Make gameplay mode global, remove appearance modes, and connect the existing How-to-Play tutorial to the active application shell."
context:
  - "loops_game_design_spec.md"
  - "PROJECT_STRUCTURE_AND_DEPLOYMENT.md"
  - "orchestration/REQUIREMENTS.md"
  - "orchestration/ENHANCEMENTS_IMPLEMENTATION_PLAN.md"
  - "orchestration/ORCHESTRATOR_INSTRUCTIONS.md"
  - "apps/web-game/src/app/AppShell.tsx"
  - "apps/web-game/src/components/tutorial/Tutorial.tsx"
  - "apps/web-game/src/accessibility/AccessibilitySettings.tsx"
  - "apps/web-game/src/persistence/defaults.ts"
dependencies: ["E1-01", "E1-03"]
writeScope:
  - "apps/web-game/src/app/AppShell.tsx"
  - "apps/web-game/src/app/SettingsPanel.tsx"
  - "apps/web-game/src/app/integration/GameIntegration.tsx"
  - "apps/web-game/src/accessibility/types.ts"
  - "apps/web-game/src/accessibility/preferences.ts"
  - "apps/web-game/src/accessibility/AccessibilitySettings.tsx"
  - "apps/web-game/src/accessibility/index.ts"
  - "apps/web-game/src/accessibility/accessibility.test.ts"
  - "apps/web-game/src/components/tutorial/Tutorial.tsx"
  - "apps/web-game/src/components/tutorial/tutorial.css"
  - "apps/web-game/src/components/tutorial/index.ts"
  - "apps/web-game/src/components/tutorial/tutorial.test.ts"
  - "apps/web-game/src/styles/tokens.css"
  - "apps/web-game/src/styles/global.css"
forbiddenScope:
  - "apps/web-game/src/state/game-flow/**"
  - "apps/web-game/src/screens/**"
  - "apps/web-game/src/persistence/**"
  - "packages/**"
  - "schemas/**"
  - "tests/e2e/**"
  - "orchestration/task-registry.json"
  - "orchestration/briefs/**"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-brief.yaml"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-report.yaml"
acceptanceCriteria:
  - id: "AC-1"
    description: "Settings exposes Relaxed and Assisted as the global gameplay-mode choice, persists defaultMode, and applies it to newly started selected puzzles."
  - id: "AC-2"
    description: "Changing the global default does not mutate an active session, and Continue still uses the mode stored with saved progress."
  - id: "AC-3"
    description: "VisualMode, data-visual-mode, Dark Mode controls, High Contrast controls, dark tokens, high-contrast tokens, and their runtime branches are removed."
  - id: "AC-4"
    description: "High Contrast is removed from accessibility preference state and controls while reduced-motion behavior remains intact."
  - id: "AC-5"
    description: "How to play opens the existing Tutorial dialog through controlled application state rather than the dead #how-to-play hash link."
  - id: "AC-6"
    description: "Tutorial close, skip, Back, Next, and completion actions work with mouse and keyboard input, with focus entering and returning from the dialog safely."
requiredChecks:
  - "npm run typecheck"
  - "npm run test"
  - "npm run build"
implementationReportPath: "runs/<run-id>/tasks/E1-04/implementation-report.yaml"
instructions:
  - "Read this brief and all listed context before editing."
  - "Use the E1-01 settings contract and E1-03 flow props rather than introducing parallel settings or mode state."
  - "Keep reduced-motion behavior and browser prefers-reduced-motion support intact."
  - "Treat the tutorial as a reusable controlled dialog and do not start a puzzle unexpectedly from navigation completion."
  - "Implement keyboard and focus behavior with the smallest reliable approach supported by the current stack."
  - "Modify only the assigned write scope and preserve unrelated user changes."
  - "Run the required checks or record why a check is unavailable."
  - "Write the implementation report before returning and list every changed file."
