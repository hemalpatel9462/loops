schemaVersion: "1.0"
artifactType: verification-brief
taskId: "E1-04"
implementationReportPath: "runs/<run-id>/tasks/E1-04/implementation-report.yaml"
scopeReviewed:
  - "apps/web-game/src/app/AppShell.tsx"
  - "apps/web-game/src/app/SettingsPanel.tsx"
  - "apps/web-game/src/app/integration/GameIntegration.tsx"
  - "apps/web-game/src/accessibility/**"
  - "apps/web-game/src/components/tutorial/**"
  - "apps/web-game/src/styles/tokens.css"
  - "apps/web-game/src/styles/global.css"
acceptanceCriteria:
  - id: "AC-1"
    description: "Settings exposes Relaxed and Assisted as the global gameplay-mode choice, persists defaultMode, and applies it to newly started selected puzzles."
  - id: "AC-2"
    description: "Changing the global default does not mutate an active session, and Continue still uses the mode stored with saved progress."
  - id: "AC-3"
    description: "VisualMode, data-visual-mode, Dark Mode controls, High Contrast controls, dark tokens, high-contrast tokens, and their runtime branches are removed."
  - id: "AC-4"
    description: "High Contrast is removed from accessibility preference state and controls while reduced-motion behavior remains intact."
  - id: "AC-5"
    description: "How to play opens the existing Tutorial dialog through controlled application state rather than the dead #how-to-play hash link."
  - id: "AC-6"
    description: "Tutorial close, skip, Back, Next, and completion actions work with mouse and keyboard input, with focus entering and returning from the dialog safely."
requiredChecks:
  - command: "npm run typecheck"
    purpose: "Verify shell, settings, accessibility, tutorial, and integration contracts compile."
  - command: "npm run test"
    purpose: "Verify persistence-connected settings behavior, accessibility, tutorial, and regression tests."
  - command: "npm run build"
    purpose: "Verify the active shell and tutorial integration bundle successfully."
constraints:
  - "Do not modify production code outside the listed scope."
  - "Do not modify game-flow or screen implementation, shared contracts, schemas, or E2E tests."
  - "Treat the implementation report as a claim and verify rendered behavior as well as source cleanup."
  - "Check every acceptance criterion independently and record evidence with file paths, test names, or command output."
verificationReportPath: "runs/<run-id>/tasks/E1-04/verification-report.yaml"
