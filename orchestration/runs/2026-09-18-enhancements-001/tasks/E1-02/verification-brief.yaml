schemaVersion: "1.0"
artifactType: verification-brief
taskId: "E1-02"
implementationReportPath: "runs/<run-id>/tasks/E1-02/implementation-report.yaml"
scopeReviewed:
  - "apps/web-game/src/state/game-flow/types.ts"
  - "apps/web-game/src/state/game-flow/puzzle-catalog.ts"
  - "apps/web-game/src/state/game-flow/game-flow.ts"
  - "apps/web-game/src/state/game-flow/index.ts"
  - "apps/web-game/src/state/game-flow/game-flow.test.ts"
acceptanceCriteria:
  - id: "AC-1"
    description: "Each difficulty exposes a deterministic one-based puzzle sequence numbered 1 through N using validated catalog order."
  - id: "AC-2"
    description: "Puzzle status exposes available, in-progress, completed, and locked states using persisted per-puzzle progress."
  - id: "AC-3"
    description: "Puzzle 1 is available initially and each later puzzle is blocked until its immediate predecessor has a completed persisted record."
  - id: "AC-4"
    description: "The selected-puzzle API starts valid available puzzles, resumes unfinished progress, allows completed-puzzle replay, and rejects invalid or locked selections without creating progress."
  - id: "AC-5"
    description: "Daily Loop remains deterministic and Continue preserves saved edge state, elapsed time, hints, checks, and mode."
  - id: "AC-6"
    description: "Quick Play is no longer required by the game-flow public path while Daily Loop and Continue sources remain supported."
requiredChecks:
  - command: "npm run typecheck"
    purpose: "Verify the progression types and all existing flow consumers compile."
  - command: "npm run test"
    purpose: "Verify unlock, status, selected-puzzle, Daily Loop, Continue, and regression behavior."
  - command: "npm run build"
    purpose: "Verify the new flow APIs can be bundled by the application."
constraints:
  - "Do not modify production code outside the listed scope."
  - "Do not modify UI, persistence implementation, puzzle data, task registry, or brief files."
  - "Treat the implementation report as a claim and verify behavior through tests and direct inspection."
  - "Check every acceptance criterion independently and record evidence with test names or command output."
verificationReportPath: "runs/<run-id>/tasks/E1-02/verification-report.yaml"
