schemaVersion: "1.0"
artifactType: verification-brief
taskId: "E1-01"
implementationReportPath: "runs/<run-id>/tasks/E1-01/implementation-report.yaml"
scopeReviewed:
  - "packages/puzzle-format/src/types.ts"
  - "schemas/app-settings.schema.json"
  - "apps/web-game/src/persistence/defaults.ts"
  - "apps/web-game/src/persistence/schema-validation.ts"
  - "apps/web-game/src/persistence/types.ts"
  - "apps/web-game/src/persistence/storage.ts"
  - "apps/web-game/src/persistence/persistence.test.ts"
acceptanceCriteria:
  - id: "AC-1"
    description: "AppSettings and the app-settings JSON schema no longer contain Theme, theme, or highContrast fields."
  - id: "AC-2"
    description: "Canonical settings records preserve defaultMode, reducedMotion, line thickness, haptics, sound, tutorial state, and locale behavior."
  - id: "AC-3"
    description: "Legacy settings containing theme and highContrast are normalized or safely discarded without preventing supported settings from loading."
  - id: "AC-4"
    description: "Persistence validation rejects malformed canonical settings and persistence tests cover read, write, reset, invalid-record, and legacy-record behavior."
  - id: "AC-5"
    description: "defaultMode remains persistable for the global gameplay-mode setting."
requiredChecks:
  - command: "npm run typecheck"
    purpose: "Verify the changed settings types and all consumers compile."
  - command: "npm run test"
    purpose: "Verify persistence behavior, legacy normalization, and regression safety."
  - command: "npm run validate:schemas"
    purpose: "Verify the updated shared schema contract."
  - command: "npm run build"
    purpose: "Verify the production bundle accepts the new settings contract."
constraints:
  - "Do not modify production code outside the listed scope."
  - "Do not modify task registry, briefs, or verification artifacts."
  - "Treat the implementation report as a claim and verify it against the files and tests."
  - "Check every acceptance criterion independently and record evidence with file paths or command output."
verificationReportPath: "runs/<run-id>/tasks/E1-01/verification-report.yaml"
