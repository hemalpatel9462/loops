    change: Removed the Theme type and theme/highContrast fields from AppSettings.
  - path: schemas/app-settings.schema.json
    change: Removed theme/highContrast properties and required entries from the canonical schema.
  - path: apps/web-game/src/persistence/defaults.ts
    change: Updated DEFAULT_SETTINGS to contain only supported canonical settings.
  - path: apps/web-game/src/persistence/schema-validation.ts
    change: Made parseAppSettings canonical-only and added legacy appearance-field normalization.
  - path: apps/web-game/src/persistence/storage.ts
    change: Added normalized settings reads with best-effort canonical rewrite and read-only-store resilience.
  - path: apps/web-game/src/persistence/persistence.test.ts
    change: Covered supported settings persistence, reset, malformed settings removal, and legacy normalization.
