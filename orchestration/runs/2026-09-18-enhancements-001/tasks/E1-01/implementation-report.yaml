summary: >-
  Removed theme and high-contrast settings from the shared AppSettings contract,
  JSON schema, defaults, and canonical runtime validation. Added backward-safe
  read-time normalization that preserves supported settings and rewrites legacy
  records to the canonical shape when storage is writable. Expanded persistence
  coverage for supported settings, reset, malformed records, and legacy records.
