schemaVersion: "1.0"
artifactType: task-brief
taskId: "E1-01"
title: "Settings contracts and persistence cleanup"
phase: 4
goal: "Remove Dark Mode and High Contrast from the settings contract and storage path while preserving supported settings and reduced-motion behavior."
context:
  - "loops_game_design_spec.md"
  - "PROJECT_STRUCTURE_AND_DEPLOYMENT.md"
  - "orchestration/REQUIREMENTS.md"
  - "orchestration/ENHANCEMENTS_IMPLEMENTATION_PLAN.md"
  - "orchestration/ORCHESTRATOR_INSTRUCTIONS.md"
  - "packages/puzzle-format/src/types.ts"
  - "schemas/app-settings.schema.json"
dependencies: ["P0-02", "P2-05"]
writeScope:
  - "packages/puzzle-format/src/types.ts"
  - "schemas/app-settings.schema.json"
  - "apps/web-game/src/persistence/defaults.ts"
  - "apps/web-game/src/persistence/schema-validation.ts"
  - "apps/web-game/src/persistence/types.ts"
  - "apps/web-game/src/persistence/storage.ts"
  - "apps/web-game/src/persistence/persistence.test.ts"
forbiddenScope:
  - "apps/web-game/src/state/game-flow/**"
  - "apps/web-game/src/screens/**"
  - "apps/web-game/src/app/**"
  - "apps/web-game/src/accessibility/**"
  - "apps/web-game/src/styles/**"
  - "tests/e2e/**"
  - "orchestration/task-registry.json"
  - "orchestration/briefs/**"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-brief.yaml"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-report.yaml"
acceptanceCriteria:
  - id: "AC-1"
    description: "AppSettings and the app-settings JSON schema no longer contain Theme, theme, or highContrast fields."
  - id: "AC-2"
    description: "Canonical settings records preserve defaultMode, reducedMotion, line thickness, haptics, sound, tutorial state, and locale behavior."
  - id: "AC-3"
    description: "Legacy settings containing theme and highContrast are normalized or safely discarded without preventing supported settings from loading."
  - id: "AC-4"
    description: "Persistence validation rejects malformed canonical settings and persistence tests cover read, write, reset, invalid-record, and legacy-record behavior."
  - id: "AC-5"
    description: "defaultMode remains persistable for the global gameplay-mode setting."
requiredChecks:
  - "npm run typecheck"
  - "npm run test"
  - "npm run validate:schemas"
  - "npm run build"
implementationReportPath: "runs/<run-id>/tasks/E1-01/implementation-report.yaml"
instructions:
  - "Read this brief and all listed context before editing."
  - "Modify only the assigned write scope and preserve unrelated user changes."
  - "Keep persistence behavior backward-safe for existing local settings records."
  - "Do not remove reduced-motion support; only remove theme and high-contrast settings."
  - "Run the required checks or record why a check is unavailable."
  - "Write the implementation report before returning and list every changed file."
