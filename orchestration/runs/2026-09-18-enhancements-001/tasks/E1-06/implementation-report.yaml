  - "The final browser suite reports four intentional skips: reduced-motion accessibility is only applicable to the reduced-motion project, and responsive coverage is intentionally limited to phone, tablet, and desktop as specified by the E1-05 acceptance criteria."
  - "The E1-04 scope did not include the legacy accessibility.css file, so dormant high-contrast selectors remain unimported source residue; active bundle, UI, and browser checks pass."
  - "The E1-05 implementation report records an earlier failed test:e2e attempt followed by a final successful run; this gate relies on the independently reproduced final exit-0 run."
knownRisks:
  - "Dormant high-contrast selectors remain in apps/web-game/src/accessibility/accessibility.css outside E1-04's write scope; they are not imported or present in the active production CSS bundle."
  - "The compatibility-only selectQuickPlayPuzzle export and apps/web-game/src/app/integration/puzzle-loader.ts boundary remain for existing non-user-facing integration compatibility; no active screen or application flow invokes them."
  - "The E1-01 legacy settings normalizer still contains highContrast as a discarded backward-compatibility field; it is not an active setting, visual branch, or user-facing control."
  - "The tutorial browser test reaches Skip and Next controls after explicit focus rather than proving a fully sequential Tab-only traversal; E1-05 verification recorded this as a low residual coverage risk, while production focus trapping and all browser assertions pass."
