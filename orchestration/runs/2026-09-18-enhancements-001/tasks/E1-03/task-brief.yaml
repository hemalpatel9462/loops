schemaVersion: "1.0"
artifactType: task-brief
taskId: "E1-03"
title: "Start screen and numbered puzzle-selection UI"
phase: 4
goal: "Implement the revised user-facing selection flow and remove the old selection-screen copy, Play mode picker, and Quick Play action."
context:
  - "loops_game_design_spec.md"
  - "PROJECT_STRUCTURE_AND_DEPLOYMENT.md"
  - "orchestration/REQUIREMENTS.md"
  - "orchestration/ENHANCEMENTS_IMPLEMENTATION_PLAN.md"
  - "orchestration/ORCHESTRATOR_INSTRUCTIONS.md"
  - "apps/web-game/src/screens/GameFlowScreen.tsx"
  - "apps/web-game/src/screens/ModeSelectionScreen.tsx"
  - "apps/web-game/src/state/game-flow/types.ts"
dependencies: ["E1-02"]
writeScope:
  - "apps/web-game/src/screens/types.ts"
  - "apps/web-game/src/screens/index.ts"
  - "apps/web-game/src/screens/GameFlowScreen.tsx"
  - "apps/web-game/src/screens/ModeSelectionScreen.tsx"
  - "apps/web-game/src/screens/screens.css"
  - "apps/web-game/src/screens/StartScreen.tsx"
  - "apps/web-game/src/screens/PuzzleSelectionScreen.tsx"
forbiddenScope:
  - "apps/web-game/src/state/game-flow/**"
  - "apps/web-game/src/persistence/**"
  - "apps/web-game/src/app/**"
  - "apps/web-game/src/accessibility/**"
  - "apps/web-game/src/components/**"
  - "apps/web-game/src/styles/**"
  - "tests/e2e/**"
  - "orchestration/task-registry.json"
  - "orchestration/briefs/**"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-brief.yaml"
  - "orchestration/runs/<run-id>/tasks/<task-id>/verification-report.yaml"
acceptanceCriteria:
  - id: "AC-1"
    description: "A fresh visit shows a start screen before difficulty or puzzle selection, and its primary action enters selection without starting a puzzle."
  - id: "AC-2"
    description: "Difficulty controls show each difficulty's available puzzle count and selecting one reveals one-based puzzle numbers."
  - id: "AC-3"
    description: "Locked puzzle controls are disabled, labelled, and cannot start a session; completed puzzles show a success treatment and non-color status text."
  - id: "AC-4"
    description: "The Play mode fieldset, Quick Play action, Play at your pace heading, and offline-validation tagline are absent from the selection flow."
  - id: "AC-5"
    description: "Daily Loop and Continue remain reachable, and back navigation works between start, selection, Daily Loop, and Continue screens."
  - id: "AC-6"
    description: "The revised screens remain responsive without horizontal overflow at phone, tablet, and desktop widths."
requiredChecks:
  - "npm run typecheck"
  - "npm run test"
  - "npm run build"
implementationReportPath: "runs/<run-id>/tasks/E1-03/implementation-report.yaml"
instructions:
  - "Read this brief and all listed context before editing."
  - "Consume the E1-02 progression APIs rather than duplicating unlock logic in components."
  - "Keep status communication accessible and do not rely on color alone for locked or completed states."
  - "Do not add a replacement Quick Play path under a different label."
  - "Modify only the assigned write scope and preserve unrelated user changes."
  - "Run the required checks or record why a check is unavailable."
  - "Write the implementation report before returning and list every changed file."
