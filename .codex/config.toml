[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[agents.loops_implementation_worker]
description = "Implements one bounded Loops task within an assigned write scope."
config_file = "agents/loops-implementation-worker.toml"

[agents.loops_verification_worker]
description = "Verifies one completed Loops implementation task against its acceptance criteria."
config_file = "agents/loops-verification-worker.toml"

[permissions.loops-verifier]
description = "Runs Loops verification with read-only project files and writable orchestration run artifacts."
extends = ":workspace"

[permissions.loops-verifier.filesystem.":workspace_roots"]
"." = "read"
"orchestration/runs" = "write"
